name: Build SmartGlow GT APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Accept licenses and install NDK
        run: |
          SDKMANAGER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" -name sdkmanager -type f | head -1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "ndk;29.0.13113456"

      - name: Create .env if missing
        run: |
          if [ ! -f .env ]; then
            echo "Creating placeholder .env"
            touch .env
          fi

      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: SmartGlow-GT-APK
          path: build/app/outputs/flutter-apk/app-release.apk
